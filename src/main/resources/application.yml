spring:
  application:
    name: rewards-program
  datasource:
    url: jdbc:h2:mem:rewardsdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  jackson:
    deserialization:
      accept-float-as-int: false
  h2:
    console:
      enabled: true
